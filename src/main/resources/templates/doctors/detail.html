<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${doctor.displayName})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <a th:href="@{/doctors}" class="small text-decoration-none">&larr; <span th:text="#{common.back}">Back</span></a>

    <div class="row g-4 mt-1">
        <div class="col-12 col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <div class="d-flex gap-3 align-items-center mb-3">
                        <div class="doctor-avatar"><i class="bi bi-person-badge"></i></div>
                        <div>
                            <h1 class="h5 mb-1" th:text="${doctor.displayName}">Doctor</h1>
                            <span class="badge bg-primary-subtle text-primary-emphasis" th:text="${doctor.specialty.localizedName}">Spec</span>
                        </div>
                    </div>
                    <p class="mb-2"><i class="bi bi-award"></i>
                        <span th:text="#{doctor.experience(${doctor.yearsExperience})}">10 years</span></p>
                    <p class="text-muted mb-0" th:text="${doctor.bio}">Bio</p>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h2 class="h5 mb-3" th:text="#{doctor.freeSlots}">Available time slots</h2>

                    <div class="alert alert-warning mb-0" th:if="${slotsByDate.isEmpty()}" th:text="#{doctor.noSlots}">No slots</div>

                    <div class="mb-3" th:each="entry : ${slotsByDate}">
                        <div class="fw-semibold mb-2">
                            <i class="bi bi-calendar-event"></i>
                            <span th:text="${#temporals.format(entry.key, 'dd/MM/yyyy')}">01/01/2026</span>
                        </div>
                        <div class="d-flex flex-wrap gap-2">
                            <th:block th:each="slot : ${entry.value}">
                                <a sec:authorize="hasRole('PATIENT')" th:href="@{/booking(slotId=${slot.id})}"
                                   class="btn btn-outline-primary btn-sm slot-btn"
                                   th:text="${#temporals.format(slot.startTime, 'HH:mm')} + ' - ' + ${#temporals.format(slot.endTime, 'HH:mm')}">09:00</a>
                                <a sec:authorize="isAnonymous()" th:href="@{/login}"
                                   class="btn btn-outline-secondary btn-sm slot-btn"
                                   th:text="${#temporals.format(slot.startTime, 'HH:mm')} + ' - ' + ${#temporals.format(slot.endTime, 'HH:mm')}">09:00</a>
                                <span sec:authorize="hasAnyRole('DOCTOR','ADMIN')" class="badge bg-light text-dark border p-2"
                                      th:text="${#temporals.format(slot.startTime, 'HH:mm')} + ' - ' + ${#temporals.format(slot.endTime, 'HH:mm')}">09:00</span>
                            </th:block>
                        </div>
                    </div>

                    <p class="small text-muted mb-0 mt-3" sec:authorize="isAnonymous()" th:text="#{doctor.loginToBook}">Log in to book</p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
