<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head(#{page.manageDoctors})}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="cb-page">
    <div class="container py-4 d-grid gap-4">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="row justify-content-center">
            <div class="col-12 col-lg-8 col-xl-7 d-grid gap-3">
                <a class="small fw-semibold text-decoration-none" th:href="@{/admin/doctors}">
                    <i class="bi bi-arrow-left"></i> <span th:text="#{adminHub.back}">Back to doctors</span></a>

                <section class="cb-panel p-4 p-md-5 d-grid gap-4">
                    <div class="d-flex align-items-center gap-3">
                        <span class="cb-kpi-icon is-mint"><i class="bi" th:classappend="${editId == null} ? 'bi-person-plus' : 'bi-person-gear'"></i></span>
                        <div>
                            <h1 class="cb-h2 m-0" th:text="${editId == null} ? #{admin.doctors.new} : #{admin.doctors.edit}">Doctor</h1>
                            <p class="small text-secondary mb-0"
                               th:text="${editId == null} ? #{adminHub.form.new.subtitle} : #{adminHub.form.edit.subtitle}">Profile</p>
                        </div>
                    </div>

                    <form th:action="${editId == null} ? @{/admin/doctors} : @{/admin/doctors/{id}(id=${editId})}"
                          th:object="${doctorRequest}" method="post" novalidate class="d-grid gap-3">
                        <div>
                            <label class="form-label" for="fullName" th:text="#{field.fullName}">Full name</label>
                            <input type="text" class="form-control" id="fullName" th:field="*{fullName}"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{fullName}">error</div>
                        </div>

                        <div class="row g-3">
                            <div class="col-12 col-md-7">
                                <label class="form-label" for="specialtyId" th:text="#{booking.specialty}">Specialty</label>
                                <select class="form-select" id="specialtyId" th:field="*{specialtyId}"
                                        th:classappend="${#fields.hasErrors('specialtyId')} ? 'is-invalid'">
                                    <option value="" th:text="#{common.choose}">-- choose --</option>
                                    <option th:each="s : ${specialties}" th:value="${s.id}" th:text="${s.localizedName}">Spec</option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{specialtyId}">error</div>
                            </div>
                            <div class="col-12 col-md-5">
                                <label class="form-label" for="yearsExperience" th:text="#{field.experienceYears}">Years</label>
                                <input type="number" min="0" class="form-control" id="yearsExperience" th:field="*{yearsExperience}"
                                       th:classappend="${#fields.hasErrors('yearsExperience')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{yearsExperience}">error</div>
                            </div>
                        </div>

                        <div>
                            <label class="form-label" for="bio" th:text="#{field.bio}">Bio</label>
                            <textarea class="form-control" id="bio" rows="4" th:field="*{bio}"
                                      th:classappend="${#fields.hasErrors('bio')} ? 'is-invalid'"></textarea>
                            <div class="invalid-feedback" th:errors="*{bio}">error</div>
                        </div>

                        <div th:if="${editId == null}" class="cb-account-box d-grid gap-3">
                            <div>
                                <div class="fw-semibold d-flex align-items-center gap-2"><i class="bi bi-key text-primary"></i>
                                    <span th:text="#{admin.doctors.account}">Login account</span></div>
                                <small class="text-secondary" th:text="#{adminHub.form.account.hint}">The doctor signs in with this account.</small>
                            </div>
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="username" th:text="#{field.username}">Username</label>
                                    <input type="text" class="form-control" id="username" th:field="*{username}" autocomplete="off">
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label" for="password" th:text="#{field.password}">Password</label>
                                    <input type="password" class="form-control" id="password" th:field="*{password}" autocomplete="new-password">
                                </div>
                            </div>
                        </div>

                        <div class="d-flex flex-wrap justify-content-end gap-2 pt-2">
                            <a class="btn btn-secondary" th:href="@{/admin/doctors}" th:text="#{common.cancel}">Cancel</a>
                            <button type="submit" class="btn btn-success"><i class="bi bi-check2"></i> <span th:text="#{common.save}">Save</span></button>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
