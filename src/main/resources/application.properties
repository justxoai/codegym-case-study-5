spring.application.name=clinicbook
server.port=${PORT:8081}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:clinicbook}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false

spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

server.servlet.session.timeout=30m

app.jwt.secret=${JWT_SECRET:xMENGmY9vInj+Fo46CVcZaHdtKXIs+OH3sHlwxioxZkV4gCqLVRhTxc30IP+r3BZ}
app.jwt.expiration-ms=86400000

logging.level.vn.codegym.clinicbook.aop=INFO
